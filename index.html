<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Burnlink</title>
<meta name="description" content="Someone sent you a note that self-destructs.">
<meta property="og:title" content="🔥 A note that self-destructs">
<meta property="og:description" content="Open it once. Then it burns.">
<style>
  :root {
    --bg: #000; --card: #171717; --ink: #fff; --ash: #8c8c8c;
    --gold: #ffc74d; --ember: #ff6b00; --flare: #ff2e54;
    --fire: linear-gradient(135deg, var(--gold), var(--ember), var(--flare));
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  #embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main {
    position: relative; min-height: 100%; max-width: 520px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    text-align: center;
  }
  .hidden { display: none !important; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
  .flame { width: 26px; height: 26px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  p.sub { color: var(--ash); max-width: 340px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 360px; padding: 16px 20px; border-radius: 999px; border: 0;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1.2; cursor: pointer; text-decoration: none;
  }
  .ico { width: 18px; height: 18px; flex: none; }
  .btn.primary { background: var(--fire); color: #000; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid rgba(255,255,255,.08); }
  .btn.text { background: none; color: var(--ember); width: auto; padding: 8px; }
  .pw {
    width: 100%; max-width: 360px; padding: 15px 18px; border-radius: 16px;
    background: var(--card); color: var(--ink); border: 1px solid rgba(255,255,255,.12);
    font: inherit; font-size: 17px; outline: none; text-align: center;
  }
  .pw:focus { border-color: rgba(255,107,0,.7); }
  .pw.bad { border-color: var(--flare); animation: shake .08s linear 5; }
  .pw-msg { color: var(--flare); font-size: 14px; font-weight: 600; min-height: 1em; }
  .pill {
    font-size: 13px; font-weight: 600; color: var(--ember);
    background: rgba(255,107,0,.16); padding: 4px 12px; border-radius: 999px;
  }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }

  /* Ignition */
  .ignite { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
  .ignite::before {
    content: ""; position: absolute; inset: -60px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,0,.45), transparent 65%);
    animation: throb 1s ease-out infinite; filter: blur(16px);
  }
  @keyframes throb { from { transform: scale(1.1); } to { transform: scale(.8); } }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .track { stroke: rgba(255,255,255,.08); }
  #ignite-num {
    font: 900 110px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    background: var(--fire); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ignite-num.tick { animation: pop .9s ease-out; }
  @keyframes pop { 0% { transform: scale(1.5); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

  /* Reading */
  .timer { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }
  .timer .ring circle { stroke-width: 8; }
  #timer-arc { filter: drop-shadow(0 0 6px currentColor); transition: stroke .3s; }
  #timer-text { font: 700 30px/1 ui-rounded, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .timer small { display: block; color: var(--ash); font-size: 11px; margin-top: 4px; }
  .note-wrap { position: relative; width: 100%; }
  .note {
    width: 100%; max-height: 50vh; overflow: auto; text-align: left;
    background: var(--card); border: 1px solid rgba(255,107,0,.25); border-radius: 24px;
    padding: 22px; font-size: 20px; font-weight: 500; white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
  }
  .note.shake { animation: shake .08s linear infinite; }
  @keyframes shake { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
  .burn-front {
    position: absolute; left: 0; right: 0; height: 12px; border-radius: 999px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--gold), var(--ember), var(--flare), transparent);
    filter: blur(6px); mix-blend-mode: plus-lighter; opacity: 0;
  }
  body.away .note { filter: blur(18px); }

  /* Ashes */
  .ash-icon { width: 72px; height: 72px; color: var(--ash); animation: breathe 2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  .fade-in { animation: fadeIn .5s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.97); } }
</style>
</head>
<body>
<canvas id="embers"></canvas>
<main>
  <!-- Gate: nothing is decrypted or burned until the reader taps. Email link scanners never tap. -->
  <section id="gate" class="stack hidden">
    <div class="brand"><svg class="flame" viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc74d"/><stop offset=".5" stop-color="#ff6b00"/><stop offset="1" stop-color="#ff2e54"/></linearGradient></defs><path fill="url(#g)" d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5-1-6.5 1-9.5z"/></svg>Burnlink</div>
    <h1>Someone sent you a secret</h1>
    <p class="sub" id="gate-sub">Checking…</p>
    <span class="pill" id="gate-mode">One look</span>
    <div class="stack" style="margin-top:12px">
      <div id="pw-box" class="stack hidden">
        <input id="pw" class="pw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
        <p class="pw-msg" id="pw-msg"></p>
      </div>
      <button class="btn primary" id="reveal">Reveal the note</button>
      <a class="btn ghost" id="open-app" href="#">Open in the Burnlink app</a>
    </div>
  </section>

  <section id="ignite" class="hidden">
    <div class="ignite">
      <svg class="ring" viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="100"/><circle id="ignite-arc" cx="110" cy="110" r="100" stroke="url(#g2)"/><defs><linearGradient id="g2"><stop offset="0" stop-color="#ffc74d"/><stop offset=".5" stop-color="#ff6b00"/><stop offset="1" stop-color="#ff2e54"/></linearGradient></defs></svg>
      <span id="ignite-num">3</span>
    </div>
    <p class="sub" style="margin-top:40px">This note self-destructs</p>
  </section>

  <section id="reading" class="stack hidden">
    <div class="timer" id="timer">
      <svg class="ring" viewBox="0 0 128 128"><circle class="track" cx="64" cy="64" r="58"/><circle id="timer-arc" cx="64" cy="64" r="58"/></svg>
      <div><span id="timer-text">1:00</span><small>until it burns</small></div>
    </div>
    <div class="note-wrap" id="note-wrap">
      <div class="note" id="note"></div>
      <div class="burn-front" id="burn-front"></div>
    </div>
    <p class="sub" id="opens-left" style="font-size:13px;font-weight:600"></p>
    <button class="btn text" id="burn-now"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5-1-6.5 1-9.5z"/></svg>Burn it now</button>
  </section>

  <section id="ashes" class="stack hidden">
    <svg class="ash-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18a4 4 0 0 1-.6-7.96A5.5 5.5 0 0 1 17 9.5a4.25 4.25 0 0 1 .25 8.5z"/></svg>
    <h1 id="ash-title">Turned to ash</h1>
    <p class="sub" id="ash-sub">The note is gone. Nothing was stored anywhere.</p>
    <div class="stack" style="margin-top:24px">
      <a class="btn primary" id="get-app" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5-1-6.5 1-9.5z"/></svg>Send your own burn link</a>
    </div>
  </section>
</main>

<script>
// ---- Config -------------------------------------------------------------
// Replace with the App Store URL once the app is published.
const APP_STORE_URL = "https://apps.apple.com/";
// The deployed open counter (worker/). Local copies of this page use a local worker.
const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://127.0.0.1:8787/v1/notes"
  : "https://burnlink.virajdrolia000.workers.dev/v1/notes";

// ---- Helpers ------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const show = (id) => {
  for (const s of ["gate", "ignite", "reading", "ashes"]) $(s).classList.toggle("hidden", s !== id);
  $(id).classList.add("fade-in");
};
const bytesToB64url = (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtWindow = (sec) => sec < 120 ? `${sec} seconds` : `${Math.round(sec / 60)} minutes`;

function b64urlToBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - (s.length % 4)) % 4);
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}

// Link layout (see NoteCodec.swift):
//   [0x02][id:16][key half:32][nonce:12 + ciphertext + tag:16]
//   [0x03][id:16][key half:32][password salt:16][nonce + ciphertext + tag]   (password protected)
function parseEnvelope(fragment) {
  const blob = b64urlToBytes(fragment);
  const saltLen = blob[0] === 3 ? 16 : blob[0] === 2 ? 0 : -1;
  if (saltLen < 0 || blob.length < 1 + 16 + 32 + saltLen + 28) throw new Error("not a burn link");
  return {
    id: bytesToB64url(blob.slice(1, 17)),
    linkHalf: blob.slice(17, 49),
    salt: saltLen ? blob.slice(49, 65) : null,
    sealed: blob.slice(49 + saltLen),
  };
}

// Same as PasswordKeys in the app: PBKDF2-SHA256, 600k rounds, 64 bytes.
// First half is mixed into the note key, second half is the proof the counter checks.
async function passwordKeys(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password.normalize("NFC")), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000 }, base, 512));
  return { keyPart: bits.slice(0, 32), proof: bits.slice(32) };
}

async function reveal(env, serverHalf, keys) {
  const raw = env.linkHalf.map((b, i) => b ^ serverHalf[i] ^ (keys ? keys.keyPart[i] : 0));
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: env.sealed.slice(0, 12) }, key, env.sealed.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

// The counter answers 200 with opens left, or 404/410 once every open is used up (or the link expired).
async function api(path, method = "GET", payload) {
  let res;
  const init = { method, cache: "no-store" };
  if (payload) { init.body = JSON.stringify(payload); init.headers = { "Content-Type": "application/json" }; }
  try { res = await fetch(API + path, init); }
  catch { return { offline: true }; }
  const body = await res.json().catch(() => ({}));
  return { ...body, burned: res.status === 404 || res.status === 410, wrongPassword: res.status === 403, ok: res.ok };
}

// Small per-browser flags (e.g. "this browser has the app"); never used for open counting.
function ledgerGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function ledgerSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function ashes(title, sub) {
  $("ash-title").textContent = title;
  $("ash-sub").textContent = sub;
  show("ashes");
  embers.intensity = 0.1;
}

// ---- Embers -------------------------------------------------------------
const embers = { intensity: 0.15, origin: 1.05 };
(function emberLoop() {
  const c = $("embers"), ctx = c.getContext("2d");
  const fract = (x) => x - Math.floor(x);
  const heat = (f) => f > 0.5 ? [255, 107 + (199 - 107) * (f - 0.5) * 2, 77 * (f - 0.5) * 2]
                              : [255, 46 + (107 - 46) * f * 2, 84 * (1 - f * 2)];
  function frame(ms) {
    const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
    if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const t = ms / 1000, n = Math.floor(14 + 70 * embers.intensity);
    for (let i = 0; i < n; i++) {
      const seed = i * 12.9898;
      const r1 = fract(Math.sin(seed) * 43758.5453), r2 = fract(Math.sin(seed * 1.7) * 24634.6345), r3 = fract(Math.sin(seed * 2.3) * 13579.2468);
      const life = fract(t * (0.06 + 0.14 * r2) + r3);
      const x = w * (r1 + 0.04 * Math.sin(t * (0.8 + r2) + seed));
      const y = h * (embers.origin - life * (0.55 + 0.6 * r3));
      const rad = (1 + 2.4 * r2) * (1 - life);
      const [r, g, b] = heat(1 - life);
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${(1 - life) * (0.35 + 0.65 * embers.intensity)})`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// ---- Flow ---------------------------------------------------------------
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function ignite() {
  show("ignite");
  const arc = $("ignite-arc"), C = 2 * Math.PI * 100, num = $("ignite-num");
  arc.style.strokeDasharray = C;
  const start = performance.now();
  let last = 0;
  await new Promise((done) => {
    (function step(now) {
      const el = Math.min(3, (now - start) / 1000);
      arc.style.strokeDashoffset = C * (1 - el / 3);
      const n = Math.max(1, 3 - Math.floor(el));
      if (n !== last) {
        last = n; num.textContent = n;
        num.classList.remove("tick"); void num.offsetWidth; num.classList.add("tick");
        navigator.vibrate?.(30);
      }
      el < 3 ? requestAnimationFrame(step) : done();
    })(start);
  });
}

function read(note, deadline) {
  show("reading");
  $("note").textContent = note.text;
  const arc = $("timer-arc"), C = 2 * Math.PI * 58, total = note.window * 1000;
  arc.style.strokeDasharray = C;
  return new Promise((done) => {
    let finished = false;
    const finish = () => { if (!finished) { finished = true; done(); } };
    $("burn-now").onclick = finish;
    (function tick() {
      if (finished) return;
      const left = Math.max(0, deadline - Date.now()), f = left / total;
      arc.style.strokeDashoffset = C * (1 - f);
      const col = f > 0.5 ? "#ffa733" : f > 0.2 ? "#ff6b00" : "#ff2e54";
      arc.style.stroke = col; arc.style.color = col;
      const s = Math.ceil(left / 1000);
      $("timer-text").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      $("note").classList.toggle("shake", left < 6000);
      embers.intensity = 0.2 + 0.6 * (1 - f);
      left > 0 ? requestAnimationFrame(tick) : finish();
    })();
  });
}

async function burn() {
  const note = $("note"), front = $("burn-front"), wrap = $("note-wrap");
  note.classList.remove("shake");
  $("burn-now").style.visibility = "hidden";
  $("timer").style.transition = "opacity .6s"; $("timer").style.opacity = 0;
  navigator.vibrate?.([40, 60, 40]);
  const dur = 2400, start = performance.now();
  await new Promise((done) => {
    (function step(now) {
      const p = Math.min(1, (now - start) / dur), line = (1 - p) * 100;
      const mask = `linear-gradient(to bottom, #000 0%, #000 ${Math.max(0, line - 6)}%, transparent ${Math.max(0.01, line)}%)`;
      wrap.style.webkitMaskImage = mask; wrap.style.maskImage = mask;
      note.style.filter = `blur(${p * 4}px)`;
      wrap.style.transform = `scale(${1 - 0.04 * p})`;
      front.style.opacity = p > 0 && p < 1 ? 1 : 0;
      front.style.top = `${wrap.offsetHeight * (1 - p) - 12}px`;
      embers.intensity = 1; embers.origin = 0.15 + 0.85 * (1 - p);
      p < 1 ? requestAnimationFrame(step) : done();
    })(start);
  });
  $("note").textContent = ""; // drop the plaintext from the page
  embers.origin = 1.05;
}

// Without Universal Links (paid Apple account) a page can't ask iOS whether an app is
// installed. Instead: if the page gets backgrounded right after we hand the link to the
// app, the app opened it, so remember that and skip the web view next time.
const HAS_APP = "burnlink:has-app";
function openInApp(link) {
  // iOS asks "Open in Burnlink?" first, so allow time for the reader to confirm.
  const onHide = () => { if (document.hidden) ledgerSet(HAS_APP, "1"); };
  document.addEventListener("visibilitychange", onHide);
  addEventListener("pagehide", onHide);
  setTimeout(() => {
    document.removeEventListener("visibilitychange", onHide);
    removeEventListener("pagehide", onHide);
  }, 30000);
  location.href = link;
}

// Reader is known to have the app: make "Open in app" the main, first button.
function preferApp() {
  const app = $("open-app"), reveal = $("reveal");
  app.classList.replace("ghost", "primary");
  reveal.classList.replace("primary", "ghost");
  reveal.textContent = "Reveal it here instead";
  app.parentNode.insertBefore(app, reveal);
}

async function main() {
  $("get-app").href = APP_STORE_URL;
  const fragment = location.hash.slice(1);
  // Remove the secret from the address bar and history straight away.
  history.replaceState(null, "", location.pathname + location.search);

  if (!fragment) return ashes("Nothing here", "This page opens Burnlink notes. Ask the sender for the full link.");

  let env;
  try { env = parseEnvelope(fragment); }
  catch { return ashes("Not a burn link", "That link is broken or was cut off. Ask the sender to copy it again."); }

  // Peek at how many opens are left. This doesn't use one up, so link previews and email scanners are harmless.
  const status = await api(`/${env.id}`);
  if (status.offline) return ashes("Couldn't connect", "Opening a note needs the internet, to check it still has opens left. Check your connection and reload.");
  if (status.burned) return ashes("Already burned", "This link is used up, or had too many wrong passwords. It's gone for good.");
  if (!status.ok) return ashes("Something went wrong", "Burnlink couldn't check this link. Try again in a moment.");

  $("gate-mode").textContent = status.total === 1 ? "One look" : `${status.remaining} of ${status.total} opens left`;
  $("gate-sub").textContent = status.remaining === 1
    ? "This is the last open. After you reveal it, nobody can open it again."
    : `It can be opened ${plural(status.remaining, "more time", "more times")}, on any device. Each reveal uses one.`;
  if (env.salt) {
    $("pw-box").classList.remove("hidden");
    $("gate-sub").textContent += " It's password protected. A wrong password doesn't use an open, but 5 wrong tries burn it.";
  }
  const appLink = "burnlink://n#" + fragment;
  $("open-app").href = appLink;
  $("open-app").onclick = (e) => { e.preventDefault(); openInApp(appLink); };
  show("gate");
  // This browser has handed a note to the app before, so the app is installed: go straight there.
  if (ledgerGet(HAS_APP)) { preferApp(); openInApp(appLink); }

  let busy = false;
  const attempt = async () => {
    if (busy) return; // a double-tap must not use up a second open
    let keys = null;
    if (env.salt) {
      const pw = $("pw").value;
      if (!pw) { $("pw").focus(); return; }
      busy = true;
      $("reveal").textContent = "Checking…";
      keys = await passwordKeys(pw, env.salt);
    }
    busy = true;
    const res = await api(`/${env.id}/open`, "POST", keys ? { auth: bytesToB64url(keys.proof) } : undefined);
    if (res.wrongPassword) {
      busy = false;
      $("reveal").textContent = "Reveal the note";
      $("pw").value = "";
      $("pw").classList.remove("bad"); void $("pw").offsetWidth; $("pw").classList.add("bad");
      $("pw-msg").textContent = `Wrong password. ${plural(res.attemptsLeft, "more try", "more tries")} before it burns for good.`;
      $("pw").focus();
      navigator.vibrate?.([30, 40, 30]);
      return;
    }
    $("reveal").onclick = null;
    if (res.offline) return ashes("Couldn't connect", "Check your connection and tap the link again.");
    if (res.burned) return ashes("Already burned", env.salt
      ? "Too many wrong passwords, or someone used the last open just before you. It's gone for good."
      : "Someone used the last open just before you. It's gone for good.");
    let note;
    try { note = await reveal(env, b64urlToBytes(res.share), keys); }
    catch { return ashes("Not a burn link", "That link is broken or was cut off. Ask the sender to copy it again."); }
    $("opens-left").textContent = res.remaining === 0
      ? "Last open. Gone for good after this."
      : `${plural(res.remaining, "more open", "more opens")} left on this link`;
    await ignite();
    await read(note, Date.now() + note.window * 1000);
    await burn();
    if (res.remaining === 0) ashes("Turned to ash", "That was the last open. Its key is destroyed, so nobody can open it again.");
    else ashes("Gone from this screen", `The link can be opened ${plural(res.remaining, "more time", "more times")}, on any device.`);
  };
  $("reveal").onclick = attempt;
  $("pw").onkeydown = (e) => { if (e.key === "Enter") attempt(); };
}

// A new link tapped while this tab is already open only changes the hash; start over.
addEventListener("hashchange", () => location.reload());
document.addEventListener("visibilitychange", () => document.body.classList.toggle("away", document.hidden));
main();
</script>
</body>
</html>
